name: Build Project for PR

#on:
#  # Запуск только при создании или обновлении pull request в ветку main
#  pull_request:
#    branches:
#      - 'main'

on:
  # Запуск при создании или обновлении pull request во все ветки
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      kafka:
        image: bitnami/kafka:4.0.0
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

    steps:
      # Шаг 1: Клонируем код
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sanity check Docker
        run: |
          docker --version
          docker info

      # Шаг 3: Компиляция проекта (без тестов)
      - name: Compile with Maven
        run: mvn -B clean compile

      # Шаг 4: Запуск тестов
      - name: Run tests
        run: mvn -B test

      # Шаг 5: Запуск Checkstyle
      - name: Run Checkstyle for payment-service-application
        working-directory: ./payment-service-app
        run: mvn -B checkstyle:check
